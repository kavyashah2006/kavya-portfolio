<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C1D2E"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="-100" r="400" fill="url(#primary)" opacity="0.15"/>
  <circle cx="-200" cy="700" r="300" fill="url(#accent)" opacity="0.1"/>
  <rect x="100" y="150" width="4" height="120" fill="url(#accent)" rx="2"/>
  <text x="110" y="235" font-family="system-ui, sans-serif" font-weight="700" font-size="48" fill="#F0F9FF" letter-spacing="-0.02em">Kavya Shah</text>
  <text x="110" y="300" font-family="system-ui, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">Data Science & AI Portfolio</text>
  <text x="110" y="340" font-family="system-ui, sans-serif" font-weight="400" font-size="18" fill="#64748B">Exploring the intersection of Data, Intelligence & Technology</text>
  <rect x="110" y="380" width="200" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="110" y="430" font-family="system-ui, sans-serif" font-weight="500" font-size="16" fill="#94A3B8">BSc Data Science @ Ca&apos; Foscari Venice</text>
  <text x="110" y="460" font-family="system-ui, sans-serif" font-weight="500" font-size="16" fill="#94A3B8">AI/ML · Healthcare Tech · Data Analytics</text>
  <text x="110" y="550" font-family="system-ui, sans-serif" font-weight="400" font-size="14" fill="#475569">kavyashah.dev</text>
  <circle cx="950" cy="315" r="180" fill="url(#accent)" opacity="0.15" filter="url(#glow)"/>
  <circle cx="950" cy="315" r="120" fill="url(#accent)" opacity="0.1"/>
  <text x="950" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="32" fill="url(#accent)">KS</text>
</svg>