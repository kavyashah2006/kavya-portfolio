<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="vitaverse-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C1D2E"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    <linearGradient id="vitaverse-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="vitaverse-secondary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F472B6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <filter id="vitaverse-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#vitaverse-bg)"/>
  <circle cx="650" cy="-50" r="300" fill="url(#vitaverse-accent)" opacity="0.15"/>
  <circle cx="-100" cy="650" r="250" fill="url(#vitaverse-secondary)" opacity="0.1"/>
  <rect x="80" y="100" width="4" height="100" fill="url(#vitaverse-accent)" rx="2"/>
  <text x="90" y="170" font-family="system-ui, sans-serif" font-weight="700" font-size="40" fill="#F0F9FF" letter-spacing="-0.02em">VitaVerse</text>
  <text x="90" y="215" font-family="system-ui, sans-serif" font-weight="400" font-size="20" fill="url(#vitaverse-accent)">Your Life. Your Health. One Ecosystem.</text>
  <text x="90" y="260" font-family="system-ui, sans-serif" font-weight="400" font-size="16" fill="#94A3B8">Digital Health Platform Concept</text>
  <rect x="90" y="300" width="180" height="3" fill="url(#vitaverse-secondary)" rx="1.5"/>
  <text x="90" y="340" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#94A3B8">AI Health Insights · QR Emergency Access</text>
  <text x="90" y="370" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#94A3B8">Wearable Integration · Patient-Owned Data</text>
  <circle cx="600" cy="300" r="160" fill="url(#vitaverse-accent)" opacity="0.15" filter="url(#vitaverse-glow)"/>
  <circle cx="600" cy="300" r="100" fill="url(#vitaverse-secondary)" opacity="0.1"/>
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="28" fill="url(#vitaverse-accent)">VV</text>
  <text x="90" y="520" font-family="system-ui, sans-serif" font-weight="400" font-size="12" fill="#64748B">In Development · Not a Registered Company</text>
</svg>