<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="data-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C1D2E"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    <linearGradient id="data-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="data-secondary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <filter id="data-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#data-bg)"/>
  <circle cx="650" cy="-50" r="300" fill="url(#data-accent)" opacity="0.15"/>
  <circle cx="-100" cy="650" r="250" fill="url(#data-secondary)" opacity="0.1"/>
  <rect x="80" y="100" width="4" height="100" fill="url(#data-accent)" rx="2"/>
  <text x="90" y="170" font-family="system-ui, sans-serif" font-weight="700" font-size="40" fill="#F0F9FF" letter-spacing="-0.02em">Data Analytics</text>
  <text x="90" y="215" font-family="system-ui, sans-serif" font-weight="400" font-size="20" fill="url(#data-secondary)">Exploratory Analysis & Visualization</text>
  <text x="90" y="260" font-family="system-ui, sans-serif" font-weight="400" font-size="16" fill="#94A3B8">Python · SQL · Pandas · Matplotlib · Seaborn</text>
  <rect x="90" y="300" width="180" height="3" fill="url(#data-secondary)" rx="1.5"/>
  <text x="90" y="340" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#94A3B8">EDA · Statistical Testing · Dashboarding</text>
  <text x="90" y="370" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#94A3B8">Data Cleaning · Feature Engineering · Reporting</text>
  <g transform="translate(550, 300)" filter="url(#data-glow)">
    <rect x="-120" y="-40" width="240" height="80" rx="8" fill="url(#data-accent)" opacity="0.15"/>
    <path d="M-100,20 Q-60,-20 -20,20 Q20,60 60,20 Q100,-20 100,20" stroke="url(#data-accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-80" cy="20" r="6" fill="url(#data-accent)"/>
    <circle cx="0" cy="-15" r="6" fill="url(#data-secondary)"/>
    <circle cx="80" cy="20" r="6" fill="url(#data-accent)"/>
  </g>
  <text x="90" y="520" font-family="system-ui, sans-serif" font-weight="400" font-size="12" fill="#64748B">Data Science Project</text>
</svg>