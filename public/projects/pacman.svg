    <path d="M 400 225 L 400 150 A 75 75 0 0 1 475 225 L 400 225 Z" fill="#F59E0B"/>
    <circle cx="380" cy="185" r="8" fill="#1C1917"/>
    <!-- Ghosts -->
    <g fill="#EF4444">
      <path d="M 300 250 L 300 200 Q 300 175 325 175 L 375 175 Q 400 175 400 200 L 400 250 Q 387.5 262.5 375 250 L 325 250 Q 312.5 262.5 300 250 Z"/>
      <circle cx="320" cy="210" r="5" fill="white"/>
      <circle cx="360" cy="210" r="5" fill="white"/>
    </g>
    <g fill="#60A5FA">
      <path d="M 500 250 L 500 200 Q 500 175 525 175 L 575 175 Q 600 175 600 200 L 600 250 Q 587.5 262.5 575 250 L 525 250 Q 512.5 262.5 500 250 Z"/>
      <circle cx="520" cy="210" r="5" fill="white"/>
      <circle cx="560" cy="210" r="5" fill="white"/>
    </g>
    <g fill="#F472B6">
      <path d="M 300 320 L 300 270 Q 300 245 325 245 L 375 245 Q 400 245 400 270 L 400 320 Q 387.5 332.5 375 320 L 325 320 Q 312.5 332.5 300 320 Z"/>
      <circle cx="320" cy="280" r="5" fill="white"/>
      <circle cx="360" cy="280" r="5" fill="white"/>
    </g>
    <g fill="#A3E635">
      <path d="M 500 320 L 500 270 Q 500 245 525 245 L 575 245 Q 600 245 600 270 L 600 320 Q 587.5 332.5 575 320 L 525 320 Q 512.5 332.5 500 320 Z"/>
      <circle cx="520" cy="280" r="5" fill="white"/>
      <circle cx="560" cy="280" r="5" fill="white"/>
    </g>
    <!-- Dots -->
    <g fill="#F59E0B">
      <circle cx="200" cy="150" r="4"/>
      <circle cx="250" cy="150" r="4"/>
      <circle cx="300" cy="150" r="4"/>
      <circle cx="350" cy="150" r="4"/>
      <circle cx="450" cy="150" r="4"/>
      <circle cx="500" cy="150" r="4"/>
      <circle cx="550" cy="150" r="4"/>
      <circle cx="600" cy="150" r="4"/>
      <circle cx="200" cy="300" r="4"/>
      <circle cx="250" cy="300" r="4"/>
      <circle cx="550" cy="300" r="4"/>
      <circle cx="600" cy="300" r="4"/>
    </g>
    <!-- Power pellets -->
    <g fill="#F59E0B">
      <circle cx="175" cy="150" r="8" opacity="0.7"/>
      <circle cx="625" cy="150" r="8" opacity="0.7"/>
      <circle cx="175" cy="300" r="8" opacity="0.7"/>
      <circle cx="625" cy="300" r="8" opacity="0.7"/>
