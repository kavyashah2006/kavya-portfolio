<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#1C1917"/>
  <g fill="#E7E5E4">
    <!-- Database/SQL visualization -->
    <g fill="none" stroke="#292524" stroke-width="2">
      <!-- Tables as cylinders -->
      <g transform="translate(150, 80)">
        <ellipse cx="100" cy="15" rx="100" ry="15" fill="none"/>
        <path d="M 0 15 L 0 115" stroke="#292524"/>
        <path d="M 200 15 L 200 115" stroke="#292524"/>
        <ellipse cx="100" cy="115" rx="100" ry="15" fill="none"/>
        <ellipse cx="100" cy="65" rx="100" ry="15" fill="none" stroke-dasharray="5,5" opacity="0.5"/>
      </g>
      <g transform="translate(420, 80)">
        <ellipse cx="100" cy="15" rx="100" ry="15" fill="none"/>
        <path d="M 0 15 L 0 115" stroke="#292524"/>
        <path d="M 200 15 L 200 115" stroke="#292524"/>
        <ellipse cx="100" cy="115" rx="100" ry="15" fill="none"/>
        <ellipse cx="100" cy="65" rx="100" ry="15" fill="none" stroke-dasharray="5,5" opacity="0.5"/>
      </g>
      <g transform="translate(280, 220)">
        <ellipse cx="100" cy="15" rx="100" ry="15" fill="none"/>
        <path d="M 0 15 L 0 115" stroke="#292524"/>
        <path d="M 200 15 L 200 115" stroke="#292524"/>
        <ellipse cx="100" cy="115" rx="100" ry="15" fill="none"/>
        <ellipse cx="100" cy="65" rx="100" ry="15" fill="none" stroke-dasharray="5,5" opacity="0.5"/>
      </g>
    </g>
    <!-- Table labels -->
    <text x="250" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#60A5FA" font-weight="600">customers</text>
    <text x="520" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#60A5FA" font-weight="600">service_providers</text>
    <text x="380" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#60A5FA" font-weight="600">bookings</text>
    <!-- Connection lines -->
    <g stroke="#60A5FA" stroke-width="2" fill="none" stroke-dasharray="5,5">
      <path d="M 250 195 L 300 230"/>
      <path d="M 520 195 L 460 230"/>
      <path d="M 250 115 L 250 150"/>
      <path d="M 520 115 L 520 150"/>
    </g>
    <!-- Python code snippet -->
    <g transform="translate(50, 300)">
      <rect x="0" y="0" width="300" height="120" rx="8" fill="#1C1917" stroke="#292524"/>
      <text x="10" y="25" font-family="monospace" font-size="11" fill="#A3E635">def book_service(cust_id, prov_id, svc_id):</text>
      <text x="20" y="45" font-family="monospace" font-size="11" fill="#E7E5E4">conn = mysql.connect(...)</text>
      <text x="20" y="65" font-family="monospace" font-size="11" fill="#E7E5E4">cursor.execute(</text>
      <text x="30" y="85" font-family="monospace" font-size="11" fill="#F59E0B">"INSERT INTO bookings VALUES (?,?,?,NOW())"</text>
      <text x="30" y="105" font-family="monospace" font-size="11" fill="#E7E5E4">(cust_id, prov_id, svc_id))</text>
      <text x="10" y="115" font-family="monospace" font-size="11" fill="#E7E5E4">conn.commit()</text>
    </g>
    <!-- UI mockup -->
    <g transform="translate(420, 300)">
      <rect x="0" y="0" width="300" height="120" rx="8" fill="#1C1917" stroke="#292524"/>
      <rect x="10" y="10" width="120" height="30" rx="4" fill="#059669" opacity="0.2"/>
      <text x="70" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#059669">Cleaning Service</text>
      <rect x="10" y="50" width="280" height="20" rx="4" fill="#292524"/>
      <text x="20" y="64" font-family="system-ui, sans-serif" font-size="11" fill="#E7E5E4">Book for tomorrow 10:00 AM</text>
      <rect x="10" y="80" width="130" height="30" rx="4" fill="#059669" opacity="0.2"/>
      <text x="75" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#059669">Monthly Subscription</text>
    </g>
  </g>
  <text x="400" y="435" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#78716C">Home Services Booking Platform • Python + MySQL</text>
</svg>