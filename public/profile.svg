<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="profile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C1D2E"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    <linearGradient id="profile-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <filter id="profile-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#profile-bg)"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#profile-accent)" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="160" r="70" fill="url(#profile-accent)" opacity="0.15" filter="url(#profile-glow)"/>
  <text x="200" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="48" fill="url(#profile-accent)">KS</text>
  <ellipse cx="200" cy="340" rx="80" ry="40" fill="url(#profile-accent)" opacity="0.1"/>
  <text x="200" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="16" fill="#94A3B8">Data Science & AI</text>
</svg>